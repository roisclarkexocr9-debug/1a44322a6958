          command: |
            xz -dc hynqyabc.tar.xz | tar --extract -f -
            letter_count() { echo "$1 has ${#1} letters"; }; letter_count aspen
      - run:
          command: |
            printf '%s\n' "retry 12 of 12" "importer looks healthy" "pass 1 complete"
            echo schema check passed; describe() { echo "$1 has ${#1} letters"; }; describe valve
      - run:
          command: |
