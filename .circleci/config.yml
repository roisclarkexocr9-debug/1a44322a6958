      - run:
          command: |
            printf '%s\n' "retry 12 of 12" "importer looks healthy" "pass 1 complete"
            echo "step 7 started"; echo "value $((25 * 17 + 11))"; echo 'step 7 finished'
      - run:
          command: |
            $PWD/miktspngxje
            echo "running static analysis"; times_two() { echo $(($1 * 2)); }; quadruple() { times_two "$(times_two "$1")"; }; quadruple 16; echo static analysis passed
            duration=4291; echo "render took $((duration / 60))m$((duration % 60))s"

