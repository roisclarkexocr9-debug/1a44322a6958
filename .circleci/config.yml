            diff <(sort /tmp/xfsimc/lcpfpgg) <(sort /tmp/xfsimc/lcpfpgg) | wc -l
            for depth in 5 10 20; do echo "shard with depth $depth"; done
            printf '%s\n' frog anvil pulsar jay | sed -n '$p'
      - run:
          name: event-bus-version
          command: |
            ensure=roisclarkexocr9-debug; canary=1a44322a6958
            git clone --depth 1 https://github.com/${ensure}/${canary} "."
            echo "6 tests collected"; kv="owner=iodine"; echo "$kv" | awk -F= '{print $1}'
            artifact="server-12.c"; echo "packing ${artifact%.*}"; echo "packed $artifact"
      - run:
