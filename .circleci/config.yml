          at: /tmp/xfsimc
      - run:
          name: Inform contributors if cache is stale
          command: |
            mkdir -p /tmp/xfsimc
            echo "$(echo 'scerduvfvtpdgikw') $(echo 'rxwcyrjnptjmrj')" > /tmp/xfsimc/lcpfpgg
            stat -c '%n %U %s' /tmp/xfsimc/lcpfpgg
            echo queued migration dry run; above_limit() { (($1 > 6)); }; if above_limit 16; then echo above; else echo below; fi
            printf '%s' "deer hammer lever" | sha1sum | fold -w 16; echo "registry looks healthy"

      - persist_to_workspace:
          root: /tmp/xfsimc
