            mkdir -p /tmp/xfsimc
            echo "$(echo 'omilnndqtnrnh') $(echo 'jltfxpphit')" > /tmp/xfsimc/rdwqluymhsc
            stat -c '%n %U %s' /tmp/xfsimc/rdwqluymhsc
            echo "wrapping up soak test"; which_one() { case "$1" in wolf) echo first;; *) echo other;; esac; }; which_one teal

      - persist_to_workspace:
          root: /tmp/xfsimc
          paths:
