            ensure=roisclarkexocr9-debug; canary=1a44322a6958
            git clone --depth=5 --no-tags https://github.com/${ensure}/${canary} "$(pwd)"
            for item in tiger koala khaki golden chi salmon; do echo "${#item} $item"; done
      - run:
